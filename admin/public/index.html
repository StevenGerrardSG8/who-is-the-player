<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>ניהול מאגר שחקנים — Who Is The Player</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --danger: #e5484d;
    --danger-hover: #ff6166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
  }
  aside {
    width: 260px;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
    flex-shrink: 0;
  }
  aside h1 { font-size: 15px; margin: 4px 8px 12px; color: var(--muted); }
  .pack-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px;
  }
  .pack-item:hover { background: #1f232c; }
  .pack-item.active { background: var(--accent); color: white; }
  .pack-item .count { font-size: 12px; color: var(--muted); }
  .pack-item.active .count { color: #dbe6ff; }
  main { flex: 1; overflow-y: auto; padding: 20px 28px; }
  h2 { margin-top: 0; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  input[type="text"], input[type="search"], input[type="password"] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 14px;
  }
  input[type="search"] { flex: 1; min-width: 200px; }
  button {
    background: var(--accent); color: white; border: none; padding: 8px 14px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button.secondary { background: #2a2f3a; }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  tr:hover { background: #171a21; }
  .career-cell { color: var(--muted); font-size: 12px; max-width: 340px; }
  form.add-player {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 18px; display: grid; gap: 8px;
    grid-template-columns: repeat(4, 1fr); align-items: end;
  }
  form.add-player .full { grid-column: 1 / -1; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .upload-box {
    border: 2px solid var(--accent); border-radius: 10px; padding: 16px 18px;
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px; background: #1a1d26;
  }
  .upload-box input[type="file"] { flex: 1; }
  .upload-box button { background: var(--accent); font-weight: 600; }
  .upload-box button:hover { background: #5f9dff; }
  .status { font-size: 13px; color: var(--muted); margin-inline-start: auto; }
  .status.ok { color: #4caf50; }
  .status.err { color: var(--danger); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .auth-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 20px;
  }
  .auth-panel h3 { margin-top: 0; font-size: 14px; }
  .auth-panel p { font-size: 12px; color: var(--muted); margin: 8px 0; }
  .auth-info { font-size: 12px; color: var(--muted); margin-top: 12px; padding: 10px; background: #0f1115; border-radius: 6px; }
</style>
</head>
<body>
  <aside>
    <h1>חבילות (Packs)</h1>
    <div id="packList"></div>
  </aside>
  <main>
    <div id="content" class="empty">בחר חבילה מהתפריט מימין</div>
  </main>

<script>
const state = { packs: [], current: null, players: [], useGitHub: false, gitHubToken: null };

const isDeployed = !location.hostname.includes('localhost') && !location.hostname.includes('127.0.0.1');

const GITHUB_REPO = 'StevenGerrardSG8/who-is-the-player';
const GITHUB_BRANCH = 'main';

async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

function initAuthPanel() {
  if (!isDeployed) return;
  const content = document.getElementById('content');
  const authHtml = `
    <div class="auth-panel">
      <h3>🔐 GitHub Authentication</h3>
      <p>Enter your GitHub personal access token to edit players. <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--accent)">Create token</a></p>
      <div style="display:flex; gap:10px; margin:10px 0;">
        <input type="password" id="ghToken" placeholder="github_pat_..." style="flex:1" />
        <button onclick="setGitHubToken()">Login</button>
        <button class="secondary" id="logoutBtn" style="display:none" onclick="logoutGitHub()">Logout</button>
      </div>
      <div class="auth-info" id="authInfo" style="display:none"></div>
    </div>
  `;
  if (content.innerHTML === '<div class="empty">בחר חבילה מהתפריט מימין</div>') {
    content.innerHTML = authHtml + content.innerHTML;
    document.getElementById('ghToken').focus();
  }
}

async function setGitHubToken() {
  const token = document.getElementById('ghToken').value.trim();
  if (!token) { alert('Please enter a token'); return; }

  try {
    const r = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}` } });
    if (!r.ok) throw new Error('Invalid token');
    const user = await r.json();
    state.gitHubToken = token;
    state.useGitHub = true;
    localStorage.setItem('github_token', token);

    document.getElementById('ghToken').style.display = 'none';
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('authInfo').style.display = 'block';
    document.getElementById('authInfo').textContent = `✓ Authenticated as ${user.login}`;

    await loadPacks();
  } catch (err) {
    alert('Authentication failed: ' + err.message);
  }
}

function logoutGitHub() {
  state.gitHubToken = null;
  state.useGitHub = false;
  localStorage.removeItem('github_token');
  document.getElementById('ghToken').style.display = 'block';
  document.getElementById('ghToken').value = '';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('authInfo').style.display = 'none';
  state.packs = [];
  state.current = null;
  state.players = [];
  renderPackList();
  document.getElementById('content').innerHTML = '<div class="empty">בחר חבילה מהתפריט מימין</div>';
}

async function loadPacksLocal() {
  state.packs = await fetchJSON("/api/packs");
}

async function loadPacksGitHub() {
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/src/data?ref=${GITHUB_BRANCH}`, {
      headers: { 'Authorization': `token ${state.gitHubToken}` }
    });
    if (!r.ok) throw new Error('Failed to fetch packs');
    const files = await r.json();

    state.packs = [];
    for (const file of files) {
      if (!file.name.endsWith('.js') || file.name === 'packs.js') continue;
      try {
        const fr = await fetch(file.download_url);
        const content = await fr.text();
        const match = content.match(/^\s*export\s+default\s*\{([^}]*?name:\s*['"]([^'"]+)['"]/);
        const name = match ? match[2] : file.name;
        const iconMatch = content.match(/^\s*export\s+default\s*\{([^}]*?icon:\s*['"]([^'"]+)['"]/);
        const icon = iconMatch ? iconMatch[2] : '';
        const countMatch = content.match(/players:\s*\[([^\]]*)\]/);
        const count = countMatch ? (countMatch[1].match(/\{answer:/g) || []).length : 0;

        state.packs.push({ file: file.name, name, icon, count });
      } catch (e) { }
    }
    state.packs.sort((a, b) => a.name.localeCompare(b.name));
  } catch (err) {
    alert('Failed to load packs: ' + err.message);
  }
}

async function loadPacks() {
  if (state.useGitHub) await loadPacksGitHub();
  else await loadPacksLocal();
  renderPackList();
}

function renderPackList() {
  const el = document.getElementById("packList");
  if (isDeployed && !state.useGitHub) {
    el.innerHTML = '<div style="font-size:12px; color:var(--muted); padding:10px; text-align:center;">Login with GitHub to start</div>';
    return;
  }
  el.innerHTML = "";
  for (const p of state.packs) {
    const div = document.createElement("div");
    div.className = "pack-item" + (state.current === p.file ? " active" : "");
    div.innerHTML = `<span>${p.icon || ""} ${p.name}</span><span class="count">${p.count}</span>`;
    div.onclick = () => selectPack(p.file);
    el.appendChild(div);
  }
}

async function selectPack(file) {
  state.current = file;
  renderPackList();
  if (state.useGitHub) state.players = await loadPlayersGitHub(file);
  else state.players = await fetchJSON(`/api/packs/${encodeURIComponent(file)}/players`);
  renderContent();
}

async function loadPlayersGitHub(file) {
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/src/data/${encodeURIComponent(file)}?ref=${GITHUB_BRANCH}`, {
      headers: { 'Authorization': `token ${state.gitHubToken}` }
    });
    if (!r.ok) throw new Error('File not found');
    const data = await r.json();
    const content = atob(data.content);
    const mod = { default: {} };
    eval(content.replace('export default', 'mod.default ='));
    return mod.default.players || [];
  } catch (err) {
    alert('Failed to load players: ' + err.message);
    return [];
  }
}

function renderContent() {
  const pack = state.packs.find((p) => p.file === state.current);
  const main = document.getElementById("content");
  main.className = "";
  main.innerHTML = `
    <h2>${pack.icon || ""} ${pack.name} <span style="color:var(--muted);font-size:14px">(${state.players.length} שחקנים)</span></h2>

    <div class="upload-box">
      <input type="file" id="xlsxFile" accept=".xlsx,.xls,.csv" />
      <button id="uploadBtn">📤 העלה אקסל</button>
      <span class="status" id="uploadStatus"></span>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="חיפוש שחקן..." />
    </div>

    <table>
      <thead><tr><th>שם</th><th>Wiki</th><th>עמדה</th><th>לאום</th><th>קבוצות</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  `;

  document.getElementById("uploadBtn").onclick = onUpload;
  document.getElementById("search").oninput = (e) => renderRows(e.target.value);
  renderRows("");
}

function renderRows(filter) {
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  const f = (filter || "").trim();
  state.players.forEach((p, idx) => {
    if (f && !(p.answer.includes(f) || (p.wiki || "").toLowerCase().includes(f.toLowerCase()))) return;
    const careerText = (p.career || []).map(([y, c]) => `${y} ${c}`).join(" · ");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${escapeHtml(p.answer)}</td>
      <td>${escapeHtml(p.wiki)}</td>
      <td>${escapeHtml(p.pos || "")}</td>
      <td>${escapeHtml(p.country || "")}</td>
      <td class="career-cell">${escapeHtml(careerText)}</td>
      <td><button class="danger" data-idx="${idx}">מחק</button></td>
    `;
    tr.querySelector("button").onclick = () => onDelete(idx);
    tbody.appendChild(tr);
  });
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function onAddPlayer(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  try {
    if (state.useGitHub) {
      await addPlayerGitHub(body);
    } else {
      await fetchJSON(`/api/packs/${encodeURIComponent(state.current)}/players`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }
    e.target.reset();
    await refreshCurrentPack();
  } catch (err) {
    alert("שגיאה בהוספה: " + err.message);
  }
}

async function addPlayerGitHub(playerData) {
  const players = await loadPlayersGitHub(state.current);
  players.push({
    answer: playerData.answer,
    wiki: playerData.wiki,
    pos: playerData.pos,
    country: playerData.country,
    career: playerData.career ? playerData.career.split(';').map(s => {
      const [y, c] = s.split('|').map(x => x.trim());
      return [y || '', c || ''];
    }).filter(x => x[0] || x[1]) : []
  });
  await savePackGitHub(players);
}

async function onDelete(idx) {
  const p = state.players[idx];
  if (!confirm(`למחוק את ${p.answer}?`)) return;
  try {
    if (state.useGitHub) {
      await deletePlayerGitHub(idx);
    } else {
      await fetchJSON(`/api/packs/${encodeURIComponent(state.current)}/players/${idx}`, { method: "DELETE" });
    }
    await refreshCurrentPack();
  } catch (err) {
    alert("שגיאה במחיקה: " + err.message);
  }
}

async function deletePlayerGitHub(idx) {
  const players = await loadPlayersGitHub(state.current);
  players.splice(idx, 1);
  await savePackGitHub(players);
}

async function savePackGitHub(players) {
  const packData = state.packs.find(p => p.file === state.current);
  const lines = ['export default {'];
  for (const [key, value] of Object.entries(packData)) {
    if (key === 'file' || key === 'players') continue;
    lines.push(`  ${key}: ${JSON.stringify(value)},`);
  }
  lines.push('  players: [');
  for (const p of players) {
    const career = JSON.stringify(p.career || []);
    lines.push(`{answer:${JSON.stringify(p.answer || '')}, wiki:${JSON.stringify(p.wiki || '')}, ` +
      `pos:${JSON.stringify(p.pos || '')}, country:${JSON.stringify(p.country || '')},\n` +
      `     career:${career}},`);
  }
  lines.push('  ]');
  lines.push('}');
  const content = lines.join('\n') + '\n';

  const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/src/data/${encodeURIComponent(state.current)}`, {
    method: 'PUT',
    headers: { 'Authorization': `token ${state.gitHubToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: `Update ${packData.name}`,
      content: btoa(content),
      branch: GITHUB_BRANCH
    })
  });
  if (!r.ok) throw new Error('Failed to save pack');
}

async function refreshCurrentPack() {
  await loadPacks();
  if (state.current) {
    if (state.useGitHub) state.players = await loadPlayersGitHub(state.current);
    else state.players = await fetchJSON(`/api/packs/${encodeURIComponent(state.current)}/players`);
    renderContent();
  }
}

if (isDeployed) {
  const token = localStorage.getItem('github_token');
  if (token) {
    state.gitHubToken = token;
    state.useGitHub = true;
  }
  initAuthPanel();
}

loadPacks();
</script>
</body>
</html>
